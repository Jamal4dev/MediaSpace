{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}MediaSpace{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'gallery/css/style.css' %}">
</head>
<body>

    <header class="navbar">
        <a href="{% url 'home' %}" class="logo">MediaSpace<span>.</span></a>

        <nav>
            <a href="{% url 'home' %}">Home</a>
            <a href="{% url 'images' %}">Images</a>
            <a href="{% url 'videos' %}">Videos</a>
            <a href="{% url 'audio' %}">Audio</a>
        </nav>
    </header>

    <main>
        {% block content %}
        {% endblock %}
    </main>

    <footer>
        <p>&copy; 2026 MediaSpace. All rights reserved.</p>
        <p>Explore. Watch. Listen.</p>
    </footer>

</body>
</html>
